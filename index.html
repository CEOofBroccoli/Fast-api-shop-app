<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
        integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>N-Market</title>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar fixed-top navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand lalezar fs-3" href="#">فروشگاه ان-مارکت</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title lalezar" id="offcanvasNavbarLabel">فروشگاه ان-مارکت</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <div class="collapse position-lg-fixed" id="courseCollapse">
                                <div class="course-list">
                                </div>
                            </div>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">
                                <i class="fa-solid fa-house fs-4 d-lg-none"></i>
                                <span class="mx-2 fs-5">صفحه اصلی</span>
                            </a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link" href="#">
                                <span class="mx-2 fs-5">تماس با ما</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>


    <!-- Header -->
    <section class="mt-5 py-5">
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-5 offset-lg-1">
                    <h3>آشنایی با ما</h3>
                    <p class="my-4 iransans">
                        فروشگاه ان-مارکت با بیش از 10 سال سابقه آماده ارائه خدمت به شماست شما می توانید محصولات خود را
                        با اطمینان کامل از ما خریداری کنید
                    </p>
                    <button type="button" class="btn btn-outline-primary mt-5 py-2 px-4 rounded-pill">محصولات</button>
                </div>
                <div class="col-lg-6">
                    <img class="img-fluid" src="./assets/images/3843753.jpg" alt="Shop">
                </div>
            </div>
        </div>
    </section>


    <!-- Data -->
    <section class="mt-5">
        <div class="container">
            <h2 class="lalezar text-center">آمارها باعث افتخار ما هستند</h2>
            <div class="row mt-4">
                <div class="col-lg-3 col-md-6 col-sm-12 my-2">
                    <div class="p-3 counter-box">
                        <span class="purecounter" data-purecounter-start="0" data-purecounter-end="92">0</span>
                        <h5>رضایت مشتریان</h5>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 col-sm-12 my-2">
                    <div class="p-3 counter-box">
                        <span class="purecounter" data-purecounter-start="0" data-purecounter-end="1000">0</span>+
                        <h5>تعداد مشتریان</h5>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 col-sm-12 my-2">
                    <div class="p-3 counter-box">
                        <span class="purecounter" data-purecounter-start="0" data-purecounter-end="20">0</span>+
                        <h5>تعداد محصولات</h5>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 col-sm-12 my-2">
                    <div class="p-3 counter-box">
                        <span class="purecounter" data-purecounter-start="0" data-purecounter-end="10">0</span>+
                        <h5>سابقه</h5>
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!-- Purecounter -->
    <script src="https://cdn.jsdelivr.net/npm/@srexi/purecounterjs@1.5.0/dist/purecounter_vanilla.min.js"></script>
    <script>
        new PureCounter();
    </script>

</body>

</html>
